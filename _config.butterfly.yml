# Butterfly Theme Configuration
# Official Docs: https://butterfly.js.org/

# Navigation menu
menu:
  首页: / || fas fa-home
  音乐||fas fa-music:
    音乐空间: /music/ || fas fa-compact-disc
    音乐播放器: /music-player/ || fas fa-play-circle
  文档||fas fa-book:
    快速开始: /docs/quick-start/ || fas fa-rocket
    主题页面: /docs/pages/ || fas fa-file-alt
    标签外挂: /docs/tags/ || fas fa-tags
    常见问题: /docs/faq/ || fas fa-question-circle
    高级配置: /docs/advanced/ || fas fa-cog
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /links/ || fas fa-link
  关于: /about/ || fas fa-heart

# Code Blocks
code_blocks:
  theme: light
  macStyle: false
  height_limit: 300
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# Social Settings
social:
  fab fa-github: https://github.com/sjkncs || GitHub
  fas fa-envelope: mailto:2797660051@qq.com || Email
  fas fa-phone: tel:188-5600-8931 || 电话

# Avatar
avatar:
  img: /img/avatar.jpg
  effect: true

# Top image
index_img: /img/bg.jpg
default_top_img: /img/default_bg.jpg
archive_img: /img/archive_bg.jpg
tag_img: /img/tag_bg.jpg
category_img: /img/category_bg.jpg

# Cover
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:
    - /img/cover1.jpg
    - /img/cover2.jpg
    - /img/cover3.jpg

# Sidebar settings
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: HIT(SZ) | Urban Planning | AI Development · Quant Trading · Full Stack
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/sjkncs
  card_announcement:
    enable: true
    content: AI-Driven Web Development | 150+ Hours Volunteer Service | Award Winner | Open Source Contributor
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: false
    post_count: true
    last_push_date: true
    sort_order:

# Footer settings
footer:
  owner:
    enable: true
    since: 2025
  custom_text: By Yangting SONG | Harbin Institute of Technology (Shenzhen)
  copyright: true

# Beautify
beautify:
  enable: true
  field: post
  title-prefix-icon: '\f863'
  title-prefix-icon-color: '#F47466'

# Font settings
font:
  global-font-size: 16px
  code-font-size: 14px
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Lato, Roboto, "PingFang SC", "Microsoft YaHei", sans-serif
  code-font-family: consolas, Menlo, "PingFang SC", "Microsoft YaHei", sans-serif

# Website Background
background: /img/bg.jpg

# Footer Background
footer_bg: true

# Search
local_search:
  enable: true
  preload: false
  CDN:

# Math
mathjax:
  enable: true
  per_page: false

katex:
  enable: false
  per_page: false
  hide_scrollbar: true

# Pjax
pjax:
  enable: false
  exclude:

# PWA
pwa:
  enable: false
  manifest: /pwa/manifest.json
  apple_touch_icon: /pwa/apple-touch-icon.png
  favicon_32_32: /pwa/32.png
  favicon_16_16: /pwa/16.png
  mask_icon: /pwa/safari-pinned-tab.svg

# Snackbar
snackbar:
  enable: true
  position: bottom-left
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

# Instantpage
instantpage: true

# Pangu
pangu:
  enable: true
  field: post

# Lazyload
lazyload:
  enable: true
  field: site
  placeholder: /img/loading.gif
  blur: false

# Preloader
preloader:
  enable: false
  source: 1

# Wordcount
wordcount:
  enable: false
  post_wordcount: false
  min2read: false
  total_wordcount: false

# Busuanzi
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# Runtime
runtimeshow:
  enable: true
  publish_date: 2025/01/01 00:00:00

# Darkmode
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# Reading Mode
readmode: true

# Aside button
# Don't modify the following settings unless you know how they work
# Choose: readmode,translate,darkmode,hideAside,toc,chat,comment
rightside_item_order:
  enable: false
  hide: null
  show: null

# Inject
inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
  bottom:
    - <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    - <script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>
    - <div class="aplayer" data-id="2829883691" data-server="netease" data-type="playlist" data-fixed="true" data-autoplay="false" data-theme="#49b1f5" data-order="random" data-preload="auto" data-listmaxheight="200px"></div>

# CDN
CDN:
  option: jsdelivr

# Version
version: 5.4.3
